<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ayatt Matrix for Bloomberg Media</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0F2A45; --navy-2:#17395B; --ink:#12304D; --sky:#1CA3DE;
  --blue:#0A5CD6; --blue-soft:#E8F0FE; --amber:#C77A00; --amber-soft:#FDF3E2;
  --green:#0B7F5B; --green-soft:#E6F5F0; --red:#C0392B; --red-soft:#FBEDEC;
  --bg:#F5F8FC; --surface:#FFFFFF; --sunken:#EEF4FA; --line:#DCE6F0;
  --text:#12304D; --muted:#5E788F; --faint:#8DA3B8;
  --sh-1:0 1px 2px rgba(15,42,69,.06);
  --sh-2:0 1px 3px rgba(15,42,69,.07),0 10px 28px rgba(15,42,69,.07);
  --sh-3:0 20px 60px rgba(15,42,69,.22);
  --r:12px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1B2B; --surface:#12283D; --sunken:#16304A; --line:#23445F;
    --text:#E9F2FA; --muted:#9DB5CA; --faint:#7993AC;
    --navy:#0A1726; --navy-2:#14304C; --blue:#4B92F5; --blue-soft:#15314F;
    --amber:#E6A33A; --amber-soft:#2E2718; --green:#3FBF95; --green-soft:#12322A;
    --red:#E8796C; --red-soft:#33201E;
    --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 1px 3px rgba(0,0,0,.45),0 10px 28px rgba(0,0,0,.35);
    --sh-3:0 20px 60px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0B1B2B; --surface:#12283D; --sunken:#16304A; --line:#23445F;
  --text:#E9F2FA; --muted:#9DB5CA; --faint:#7993AC;
  --navy:#0A1726; --navy-2:#14304C; --blue:#4B92F5; --blue-soft:#15314F;
  --amber:#E6A33A; --amber-soft:#2E2718; --green:#3FBF95; --green-soft:#12322A;
  --red:#E8796C; --red-soft:#33201E;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 1px 3px rgba(0,0,0,.45),0 10px 28px rgba(0,0,0,.35);
  --sh-3:0 20px 60px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;
  font-feature-settings:'tnum' 0}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.4px}

/* ---------- shell ---------- */
.app{display:flex;height:100%;min-height:100vh}
.side{width:246px;flex:none;background:var(--navy);color:#CFE0EE;display:flex;flex-direction:column;
  padding:18px 14px calc(16px + env(safe-area-inset-bottom,0px));position:sticky;top:0;height:100vh;overflow:auto}
.lockup{background:#fff;border-radius:10px;padding:9px 12px;display:flex;align-items:center;gap:11px;margin-bottom:6px}
.lockup img.ay{height:24px;width:auto;display:block}
.lockup .vr{width:1px;height:20px;background:#C9D8E6;flex:none}
.lockup img.bb{height:18px;width:auto;display:block}
.sideprod{font-size:11px;letter-spacing:1.3px;font-weight:700;color:#7FC9EA;margin:14px 6px 10px;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;
  padding:9px 11px;border-radius:9px;color:#B9CFE2;cursor:pointer;font-size:14px;font-weight:500;transition:background .13s}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:rgba(28,163,222,.18);color:#fff;font-weight:600}
.nav button svg{width:17px;height:17px;flex:none;opacity:.9}
.nav .badge{margin-left:auto;background:var(--sky);color:#06243A;font-size:11px;font-weight:800;
  border-radius:99px;padding:1px 7px;min-width:19px;text-align:center}
.sidefoot{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.1);font-size:11.5px;color:#7F9CB5}
.sidefoot button{background:none;border:0;color:#7FC9EA;padding:0;cursor:pointer;font-size:11.5px;text-decoration:underline}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.6) blur(10px);border-bottom:1px solid var(--line);
  padding:calc(14px + env(safe-area-inset-top,0px)) 26px 14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.topbar h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.3px}
.topbar .crumb{font-size:12px;color:var(--faint);margin:0}
.spacer{flex:1}
.datechip{font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);
  border-radius:99px;padding:6px 13px;white-space:nowrap}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--navy-2);color:#fff;display:flex;
  align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:9px;width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}
.iconbtn:hover{color:var(--text);border-color:var(--faint)}
.iconbtn svg{width:16px;height:16px}
.content{padding:24px 26px 80px;max-width:1180px;width:100%}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1)}
.pad{padding:18px}
.sechead{display:flex;align-items:baseline;gap:10px;margin:28px 0 12px}
.sechead:first-child{margin-top:0}
.sechead h2{font-size:15px;margin:0;font-weight:700;letter-spacing:-.2px}
.sechead p{margin:0;font-size:12.5px;color:var(--muted)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(248px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(196px,1fr))}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;
  font-size:13px;font-weight:600;cursor:pointer;transition:.13s;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px 10px}
.btn.ghost:hover{color:var(--text);background:var(--sunken)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.chipstat{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.3px;
  padding:3px 9px;border-radius:99px;text-transform:uppercase}
.sdot{width:7px;height:7px;border-radius:50%;flex:none}
.tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:7px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.hr{height:1px;background:var(--line);margin:14px 0}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* ---------- hero ---------- */
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;border-radius:16px;
  padding:26px 28px;box-shadow:var(--sh-2);margin-bottom:22px}
.hero h2{margin:0 0 6px;font-size:25px;font-weight:800;letter-spacing:-.6px}
.hero p{margin:0;font-size:14.5px;color:#C2D8E9;max-width:760px}
.hero .row{display:flex;gap:22px;flex-wrap:wrap;margin-top:20px}

/* ---------- metrics ---------- */
.metric{padding:15px 16px}
.metric .k{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--faint);font-weight:700}
.metric .v{font-size:25px;font-weight:800;margin-top:5px;letter-spacing:-.7px}
.metric .d{font-size:12px;font-weight:600;margin-top:1px}
.metric svg{display:block;margin-top:9px;width:100%;height:28px}

/* ---------- decision ---------- */
.dec{padding:18px 19px;border-left:3px solid var(--blue)}
.dec h3{margin:0 0 3px;font-size:15.5px;font-weight:700;letter-spacing:-.2px}
.dec .meta{font-size:12px;color:var(--faint);margin-bottom:11px}
.dec .body{font-size:13.5px;color:var(--muted);margin:0 0 11px}
.dec .rec{background:var(--blue-soft);border-radius:9px;padding:10px 13px;font-size:13px;margin-bottom:13px}
.dec .rec b{color:var(--blue)}
.dec .acts{display:flex;gap:8px;flex-wrap:wrap}
.decided{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.decided:last-child{border-bottom:0}
.decided .tick{width:19px;height:19px;border-radius:50%;background:var(--green-soft);color:var(--green);
  display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
.decided .tick svg{width:11px;height:11px}

/* ---------- feed ---------- */
.ev{display:flex;gap:13px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.ev:last-child{border-bottom:0}
.ev .who{font-size:11px;font-weight:700;color:var(--sky);width:116px;flex:none;padding-top:1px;letter-spacing:.2px}
.ev .tx{flex:1;font-size:13px;min-width:0}
.ev .tm{font-size:11.5px;color:var(--faint);white-space:nowrap}

/* ---------- list rows ---------- */
.lrow{display:flex;gap:13px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.lrow:last-child{border-bottom:0}
.lrow .t{font-weight:600;font-size:14px}
.lrow .s{font-size:12.5px;color:var(--muted)}
.clickrow{cursor:pointer;transition:background .12s}
.clickrow:hover{background:var(--sunken)}

/* ---------- priority ---------- */
.prio{padding:17px 18px;cursor:pointer;transition:.13s}
.prio:hover{border-color:var(--sky);box-shadow:var(--sh-2)}
.prio .n{font-size:11px;font-weight:800;color:var(--faint);letter-spacing:.8px}
.prio h3{margin:5px 0 4px;font-size:15px;font-weight:700;letter-spacing:-.2px}
.prio .own{font-size:12px;color:var(--faint)}
.prio .val{font-size:22px;font-weight:800;margin-top:11px;letter-spacing:-.5px}
.prio .vl{font-size:11.5px;color:var(--muted)}

/* ---------- leader ---------- */
.leader{padding:17px 18px}
.leader .top{display:flex;gap:12px;align-items:center}
.leader .ini{width:38px;height:38px;border-radius:50%;background:var(--sunken);color:var(--ink);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.leader h3{margin:0;font-size:14.5px;font-weight:700}
.leader .role{font-size:12px;color:var(--faint)}
.leader .blk{margin-top:13px;font-size:13px}
.leader .blk .lb{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--faint);font-weight:700;margin-bottom:2px}

/* ---------- ask ---------- */
.askbar{display:flex;gap:9px;align-items:center;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:5px 5px 5px 15px;box-shadow:var(--sh-1)}
.askbar input{flex:1;border:0;outline:none;background:transparent;font:inherit;font-size:14.5px;color:var(--text);padding:9px 0;min-width:0}
.askbar input::placeholder{color:var(--faint)}
.sugg{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.sugg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;
  font-size:12.5px;color:var(--muted);cursor:pointer}
.sugg button:hover{border-color:var(--sky);color:var(--text)}
.answer{margin-top:18px}
.answer .q{font-size:13px;color:var(--faint);margin-bottom:7px}
.answer .a{font-size:14.5px;line-height:1.62}
.answer .a p{margin:0 0 11px}
.srcs{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}
.src{font-size:11px;font-weight:600;background:var(--sunken);color:var(--muted);padding:4px 9px;border-radius:7px}

/* ---------- drawer ---------- */
.backdrop{position:fixed;inset:0;background:rgba(10,25,40,.45);opacity:0;pointer-events:none;
  transition:opacity .22s;z-index:60}
.backdrop.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(520px,100%);background:var(--surface);
  box-shadow:var(--sh-3);transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);
  z-index:70;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.on{transform:translateX(0)}
.drawer .dh{padding:20px 22px 14px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.drawer .dh h3{margin:0;font-size:16px;font-weight:700;letter-spacing:-.2px}
.drawer .dh p{margin:3px 0 0;font-size:12.5px;color:var(--faint)}
.drawer .db{padding:20px 22px;overflow:auto;flex:1}
.drawer .df{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--faint);font-weight:700;margin-bottom:5px}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--bg);
  padding:10px 12px;font:inherit;font-size:13.5px;color:var(--text);outline:none;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(28,163,222,.16)}
.field textarea{min-height:170px;line-height:1.6}

/* ---------- toast ---------- */
.toasts{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;display:flex;
  flex-direction:column;gap:8px;align-items:center;pointer-events:none;padding:0 12px;width:100%;max-width:520px}
.toast{background:var(--navy);color:#fff;border-radius:10px;padding:11px 16px;font-size:13.5px;
  box-shadow:var(--sh-3);display:flex;align-items:center;gap:9px;animation:tin .26s ease}
.toast svg{width:15px;height:15px;color:#7FC9EA;flex:none}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.note{background:var(--sunken);border-radius:10px;padding:13px 15px;font-size:12.5px;color:var(--muted);margin-top:18px}
.note b{color:var(--text)}
.empty{text-align:center;padding:34px 20px;color:var(--faint);font-size:13.5px}

@media (max-width:900px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:static;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px}
  .nav{flex-direction:row;overflow:auto;gap:4px;padding-bottom:2px}
  .nav button{white-space:nowrap;padding:8px 12px}
  .nav button span.lbl{display:inline}
  .sidefoot{display:none}
  .sideprod{display:none}
  .topbar{padding:12px 16px}
  .content{padding:18px 16px 70px}
}

/* ---------- interaction layer ---------- */
.click{cursor:pointer;position:relative;transition:border-color .13s,box-shadow .13s,transform .13s,background .13s}
.click:hover{border-color:var(--sky)}
button:focus-visible,[role=button]:focus-visible,input:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.card.click:hover{box-shadow:var(--sh-2);transform:translateY(-1px)}
.card.click::after,.lrow.click::after{content:"\203A";position:absolute;right:15px;top:12px;color:var(--faint);font-size:22px;line-height:1;transition:transform .13s,color .13s}
.lrow.click::after{top:50%;transform:translateY(-50%)}
.card.click:hover::after{color:var(--sky);transform:translateX(2px)}
.lrow.click:hover::after{color:var(--sky);transform:translateY(-50%) translateX(2px)}
.lrow.click{padding-right:40px}
.lrow.click:hover,.ev.click:hover{background:var(--sunken)}
.ev.click{margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:8px}
.tag.click:hover,.src.click:hover,.skill.click:hover{background:var(--blue-soft);color:var(--blue);border-color:var(--blue)}
.note.click{position:relative;padding-right:92px}
.note.click:hover{background:var(--blue-soft)}
.note .more{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:700;color:var(--blue)}
.tick{width:19px;height:19px;border-radius:50%;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center;flex:none}
.tick svg{width:11px;height:11px}
.chipbtn{background:var(--amber-soft);color:var(--amber);border:1px solid transparent;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
.chipbtn:hover{border-color:var(--amber)}
.hero .row button{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:11px 18px;color:#B4CCE0;text-align:left;cursor:pointer;font-size:12.5px;transition:background .13s}
.hero .row button b{display:block;font-size:22px;color:#fff;font-weight:700;letter-spacing:-.4px;line-height:1.2}
.hero .row button:hover{background:rgba(255,255,255,.16)}
.pbar{width:130px;height:7px;border-radius:99px;background:var(--sunken);overflow:hidden;flex:none}
.pbar i{display:block;height:100%;background:var(--sky);border-radius:99px}
.seg{display:inline-flex;background:var(--sunken);border-radius:9px;padding:3px;gap:2px;margin-bottom:12px}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--sh-1)}
.brow{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:9px;cursor:pointer}
.brow:hover,.brow.on{background:var(--blue-soft)}
.brow .bl{width:150px;font-size:13px;flex:none}
.brow .bb{flex:1;height:8px;border-radius:99px;background:var(--sunken);overflow:hidden}
.brow .bb i{display:block;height:100%;background:var(--sky);border-radius:99px}
.brow .bv{width:78px;text-align:right;font-size:13px;font-weight:700}
.bigstat{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;margin-bottom:14px;flex-wrap:wrap}
.chartread{font-size:12.5px;color:var(--muted);margin-top:6px;min-height:20px}
.chartread b{color:var(--text)}
.optcard{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:9px}
.optcard.chosen{border-color:var(--green);background:var(--green-soft)}
.meta2{display:grid;gap:12px}
.meta2>div{background:var(--sunken);border-radius:10px;padding:11px 13px;font-size:13.5px}
.meta2 .k{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--faint);font-weight:700;margin-bottom:3px}
.kpibox{background:var(--sunken);border-radius:11px;padding:13px 15px}
.lvlbar{display:flex;gap:6px}
.lvlbar button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 3px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);line-height:1.25}
.lvlbar button span{font-weight:500;font-size:11px}
.lvlbar button:hover:not(:disabled){border-color:var(--blue)}
.lvlbar button.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.lvlbar button:disabled{opacity:.4;cursor:not-allowed}
.skills{display:flex;flex-wrap:wrap;gap:7px}
.skill{font-size:12px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--sunken)}
.skill b{font-weight:800;margin-right:6px}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:12px;color:var(--muted);cursor:pointer}
.fchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pal{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;padding-top:12vh;background:rgba(10,25,40,.5);z-index:100}
.pal.on{display:flex}
.palbox{width:min(580px,92vw);background:var(--surface);border-radius:14px;box-shadow:var(--sh-3);overflow:hidden}
.palbox input{width:100%;border:0;border-bottom:1px solid var(--line);padding:17px 19px;font:inherit;font-size:15px;background:transparent;color:var(--text);outline:none}
.palres{max-height:52vh;overflow:auto}
.palres div{padding:11px 19px;display:flex;gap:10px;align-items:center;cursor:pointer;font-size:13.5px}
.palres div.on,.palres div:hover{background:var(--blue-soft)}
.palres small{color:var(--faint);font-size:11.5px;margin-left:auto;white-space:nowrap}
.dec.click{border-left:3px solid var(--blue)}
.drawer .db .card{box-shadow:none}

/* ================= state ================= */
const KEY="ayatt-matrix-bbg-v3";
let S={decided:{},sent:[],levels:{},handled:{},snoozed:{},paused:{},pulled:{}};
try{const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r)||{});}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let view="today", selPrio=null, stack=[], mRange=8, mTab=0, mSeg=null, feedFilter="All", curMetric=null, ansIdx=-1;

/* ================= helpers ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const short=n=>n.replace(" Agent","");
const hash=s=>{let x=7;for(const c of String(s))x=(x*31+c.charCodeAt(0))>>>0;return x;};
const nowStr=()=>new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
const ck=spec=>`data-go="${esc(spec)}" role="button" tabindex="0"`;
function toast(msg){const d=document.createElement("div");d.className="toast";d.innerHTML=I.check+"<span>"+esc(msg)+"</span>";$("toasts").appendChild(d);setTimeout(()=>{d.style.transition="opacity .3s";d.style.opacity="0";setTimeout(()=>d.remove(),320);},2600);}
function lvlOf(r){return S.levels[r.n]!==undefined?S.levels[r.n]:r.l;}
function isLive(r){return lvlOf(r)>0&&!S.paused[r.n];}
function rosterOf(n){return ROSTER.find(x=>x.n===n);}
function spark(vals,color){const mn=Math.min(...vals),mx=Math.max(...vals),r=(mx-mn)||1;const pts=vals.map((v,i)=>`${(i/(vals.length-1))*100},${28-((v-mn)/r)*24-2}`).join(" ");return `<svg viewBox="0 0 100 28" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;}
function chip(text,color,bg){return `<span class="chipstat" style="background:${bg||"var(--sunken)"};color:${color||"var(--muted)"}">${text}</span>`;}
function agentTag(n){return `<span class="tag click" ${ck("agent:"+n)}>${esc(short(n))}</span>`;}
function noteBox(infoId,text){return `<div class="note click" ${ck("info:"+infoId)}>${text}<span class="more">Read more</span></div>`;}

/* ================= drawer machinery ================= */
function drawerHtml(title,sub,body,foot){
  return `<div class="dh">${stack.length>1?`<button class="iconbtn" data-back="1" aria-label="Back">${I.back}</button>`:""}
    <div style="flex:1;min-width:0"><h3>${title}</h3><p>${sub||""}</p></div>
    <button class="iconbtn" data-close="1" aria-label="Close">${I.x}</button></div>
    <div class="db">${body}</div>${foot?`<div class="df">${foot}</div>`:""}`;
}
function show(fn){stack.push(fn);$("drawer").innerHTML=fn();$("drawer").classList.add("on");$("drawer").setAttribute("aria-hidden","false");$("backdrop").classList.add("on");$("drawer").querySelector(".db").scrollTop=0;}
function refreshDrawer(){if(stack.length){const st=$("drawer").querySelector(".db");const top=st?st.scrollTop:0;$("drawer").innerHTML=stack[stack.length-1]();const nb=$("drawer").querySelector(".db");if(nb)nb.scrollTop=top;}}
function back(){stack.pop();if(stack.length){$("drawer").innerHTML=stack[stack.length-1]();}else closeDrawer();}
function closeDrawer(){stack=[];$("drawer").classList.remove("on");$("drawer").setAttribute("aria-hidden","true");$("backdrop").classList.remove("on");}

/* ================= navigation ================= */
const NAV=[{id:"today",t:"Today",i:I.today},{id:"priorities",t:"Priorities",i:I.prio},{id:"leaders",t:"My leaders",i:I.people},{id:"signals",t:"Signals",i:I.signal},{id:"agents",t:"Agents",i:I.agents},{id:"streams",t:"Streams",i:I.streams},{id:"ask",t:"Ask Matrix",i:I.ask}];
const openDec=()=>DECISIONS.filter(d=>!S.decided[d.id]);
const openSig=()=>SIGNALS.filter(s=>!S.handled[s.id]&&!S.snoozed[s.id]);
function renderNav(){
  $("nav").innerHTML=NAV.map(n=>{let b="";if(n.id==="today"&&openDec().length)b=`<span class="badge">${openDec().length}</span>`;if(n.id==="signals"&&openSig().length)b=`<span class="badge">${openSig().length}</span>`;
    return `<button data-act="view" data-v="${n.id}" class="${view===n.id?"on":""}">${n.i}<span class="lbl">${n.t}</span>${b}</button>`;}).join("");
}
function gotoView(v){view=v;selPrio=null;closeDrawer();render();}

  const od=openDec(), os=openSig(), done=DECISIONS.filter(d=>S.decided[d.id]);

   <p>${od.length?`${od.length} decision${od.length>1?"s":""} need${od.length>1?"":"s"} you this morning.`:"Nothing is waiting on you this morning."} Subscriptions are ahead of the net add plan, the quarter is pacing at 96.4 percent, and one advertising line is going to miss unless somebody moves it by Thursday.</p>
   <div class="row">
    <button data-act="scrolldec"><b class="num">${od.length}</b>Decisions open</button>
    <button data-act="view" data-v="signals"><b class="num">${os.length}</b>Signals to watch</button>
    <button data-act="view" data-v="agents"><b class="num">${ROSTER.filter(isLive).length}</b>Agents in production</button>
    <button ${ck("sent:all")}><b class="num">${S.sent.length}</b>Notes sent today</button>
   </div></div>`;
  h+=`<div class="grid g4">`+METRICS.map(m=>`<div class="card metric click" ${ck("metric:"+m.id)}><div class="k">${m.k}</div><div class="v num">${m.v}</div><div class="d" style="color:${m.c}">${m.d}</div>${spark(m.s,m.c)}</div>`).join("")+`</div>`;
  h+=`<div class="sechead" id="decsec"><h2>Needs a decision from you</h2><p>These reached you because nobody below you can make them.</p></div>`;
  h+=od.length?`<div class="grid" style="gap:12px">`+od.map(d=>`<div class="card dec click" ${ck("decision:"+d.id)}>
     <h3>${d.t}</h3><div class="meta">${d.owner} &nbsp;&middot;&nbsp; ${d.due}</div><p class="body">${d.body}</p>
     <div class="rec"><b>Matrix recommends:</b> ${d.rec}</div>
     <div class="acts">${d.opts.map((o,i)=>`<button class="btn ${o.p?"primary":""}" data-act="decide" data-id="${d.id}" data-i="${i}">${o.k}</button>`).join("")}<button class="btn ghost" data-act="compose" data-kind="dec" data-id="${d.id}">Ask the owner first</button></div></div>`).join("")+`</div>`
   :`<div class="card"><div class="empty">Everything that needed you today is decided.</div></div>`;
  if(done.length){h+=`<div class="sechead"><h2>Decided today</h2><p>Select one to see it again or undo it.</p></div><div class="card">`+done.map(d=>`<div class="lrow click" ${ck("decision:"+d.id)}><span class="tick">${I.check}</span><div><div class="t">${d.t}</div><div class="s">You chose: ${esc(S.decided[d.id].choice)} &nbsp;&middot;&nbsp; ${esc(S.decided[d.id].at)}</div></div></div>`).join("")+`</div>`;}
  h+=`<div class="grid g2" style="margin-top:22px">
   <div class="card pad"><div class="sechead" style="margin:0 0 8px"><h2>What the agents did this morning</h2></div>
    ${FEED.filter(f=>f.top).map(f=>`<div class="ev click" ${ck("feed:"+f.id)}><span class="who">${esc(short(f.a))}</span><span class="tx">${f.t}</span><span class="tm num">${f.m}</span></div>`).join("")}
    <div style="margin-top:10px"><button class="btn sm" ${ck("activity:all")}>See all ${FEED.length} actions</button></div></div>
   <div class="card pad"><div class="sechead" style="margin:0 0 8px"><h2>Worth asking today</h2><p>Drafted, yours to edit</p></div>
    ${os.slice(0,3).map(s=>`<div class="ev click" ${ck("signal:"+s.id)}><span class="tx"><b style="font-weight:600">${s.to}</b><br><span class="small muted">${s.q}</span></span><button class="btn sm" data-act="compose" data-kind="sig" data-id="${s.id}">Draft</button></div>`).join("")||`<div class="empty">Nothing worth raising this morning.</div>`}</div></div>`;
  h+=noteBox("routing","<b>Why this page is short.</b> Matrix does not bring you everything it knows. Operational escalations go to the leader who owns that function, and only the decisions that are genuinely yours come here.");

  if(mSeg!==null&&cur.rows[mSeg]){const r=cur.rows[mSeg];
    if(cur.u==="n")ins=`<b>${r[0]}</b> is ${(r[1]/total*100).toFixed(1)} percent of the total, ${r[1].toLocaleString()} members.`;
    else{const dl=r[1]-m.overall,above=dl>0;const good=m.lowGood?!above:above;ins=`<b>${r[0]}</b> is running ${Math.abs(dl).toFixed(1)} points ${above?"above":"below"} the overall figure of ${m.overall}%, which is ${Math.abs(dl)<0.05?"in line":(good?"better":"worse")}.`;}}

   ${chart(vals,labs,m.c,m.u,m.dec)}<div class="chartread" id="chartread">Change over the period: <b>${delta>0?"+":""}${delta.toFixed(m.dec)}${m.u}</b>. Hover or tap a point for its value.</div>

   <div class="seg">${tabs.map((t,i)=>`<button data-act="mtab" data-v="${i}" class="${mTab===i?"on":""}">${t}</button>`).join("")}</div>
   ${cur.rows.map((r,i)=>`<div class="brow ${mSeg===i?"on":""}" data-act="mseg" data-v="${i}" role="button" tabindex="0"><span class="bl">${r[0]}</span><span class="bb"><i style="width:${(r[1]/(cur.u==="n"?mx:Math.max(mx,100))*100).toFixed(1)}%"></i></span><span class="bv num">${fmt(r[1])}</span></div>`).join("")}
   <div class="note" style="margin-top:10px">${ins}</div>
   <div class="sechead" style="margin-top:20px"><h2>What is moving it</h2></div>
   ${m.why.map(w=>`<div class="decided"><div style="flex:1"><div style="font-weight:600;font-size:13.5px">${w[0]}</div><div class="small muted">${w[1]}</div></div><span class="tag">${w[2]}</span></div>`).join("")}

function chart(vals,labs,color,unit,dec){
  const W=460,H=176,p=30,mn=Math.min(...vals),mx=Math.max(...vals),r=(mx-mn)||1;
  const x=i=>p+(i/(vals.length-1))*(W-2*p),y=v=>H-p-((v-mn)/r)*(H-2*p);
  let g=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">`;
  [0,.5,1].forEach(t=>{const yy=H-p-t*(H-2*p);g+=`<line x1="${p}" x2="${W-p+6}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${p-6}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--faint)">${(mn+t*r).toFixed(dec)}</text>`;});
  g+=`<polyline points="${vals.map((v,i)=>x(i)+","+y(v)).join(" ")}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
  vals.forEach((v,i)=>{g+=`<g class="pt" data-i="${i}" style="cursor:pointer"><circle cx="${x(i)}" cy="${y(v)}" r="15" fill="transparent"/><circle cx="${x(i)}" cy="${y(v)}" r="4.5" fill="var(--surface)" stroke="${color}" stroke-width="2.2"/></g><text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--faint)">${labs[i]}</text>`;});
  return g+"</svg>";
}

function composeFor(kind,id,x){
  let to,subj,body;
  if(kind==="dec"){const d=DECISIONS.find(v=>v.id===id);to=d.owner;subj=d.t;body=`Before I decide on this, one thing.\n\n${d.body}\n\nMatrix recommends we ${d.rec.charAt(0).toLowerCase()+d.rec.slice(1)}\n\nWhat would you do, and what am I not seeing from here?\n\nKaren`;}
  else if(kind==="sig"){const s=SIGNALS.find(v=>v.id===id);to=s.to;subj=s.t;body=`${s.q}\n\nContext from Matrix: ${s.d}\n\nNo need for a long reply. A line back today is enough.\n\nKaren`;}
  else if(kind==="prio"){const p=PRIOS.find(v=>v.id===id);to=p.ask.to;subj=p.ask.subj;body=`${p.ask.q}\n\nContext: ${p.risk}\n\nKaren`;}
  else if(kind==="leader"){const l=LEADERS.find(v=>v.id===id);to=l.n;subj="A quick one";body=`${l.raise}\n\nWorth five minutes before our next one to one, or sooner if it is easier.\n\nKaren`;}
  else if(kind==="metric"){const m=METRICS.find(v=>v.id===id);to=m.ask[0];subj=m.ask[1];body=`${m.ask[2]}${x?`\n\nI was looking at ${x} specifically.`:""}\n\nKaren`;}
  else if(kind==="agent"){const r=rosterOf(id);to=r?r.o+" lead":"Chief Digital Officer";subj="A question on "+short(id);body=`I was looking at the ${short(id)} agent this morning.\n\nIs there anything about how it is behaving that you would want me to know, or anything you would change?\n\nKaren`;}
  composeNote(to,subj,body);
}
function composeNote(to,subj,bodyText){
  show(()=>drawerHtml("Note to "+esc(to),"Drafted by Matrix. Edit anything before it goes.",`<div class="field"><label>To</label><input id="dto" value="${esc(to)}"></div><div class="field"><label>Subject</label><input id="dsubj" value="${esc(subj)}"></div><div class="field"><label>Message</label><textarea id="dbody">${esc(bodyText)}</textarea></div>`,`<button class="btn" data-close="1">Cancel</button><button class="btn primary" data-act="sendnote">Send</button>`));
}

/* ================= actions ================= */
function act(el){
  const a=el.dataset.act,id=el.dataset.id,v=el.dataset.v,i=el.dataset.i;
  if(a==="view"){return gotoView(v);}
  if(a==="prio"){view="priorities";selPrio=id;closeDrawer();return render();}
  if(a==="scrolldec"){const e=$("decsec");if(e&&e.scrollIntoView)e.scrollIntoView({behavior:"smooth"});return;}
  if(a==="decide"){const d=DECISIONS.find(x=>x.id===id),o=d.opts[+i];S.decided[id]={choice:o.k,at:nowStr()};save();toast("Decision recorded and the owner has been told");render(true);refreshDrawer();return;}
  if(a==="undo"){delete S.decided[id];save();toast("Decision undone");render(true);refreshDrawer();return;}
  if(a==="compose"){return composeFor(el.dataset.kind,id,el.dataset.x||(el.dataset.kind==="metric"&&mSeg!==null&&curMetric?Object.values(curMetric.bd)[mTab].rows[mSeg][0]:""));}
  if(a==="sendnote"){const to=$("dto").value,subj=$("dsubj").value,body=$("dbody").value;S.sent.unshift({to,subj,body,at:nowStr()});save();closeDrawer();toast("Sent to "+to);return render(true);}
  if(a==="prep"){const l=LEADERS.find(x=>x.id===id);const body=`Agenda for our one to one:\n\n${l.agenda.map((x,k)=>(k+1)+". "+x).join("\n")}\n\nKaren`;S.sent.unshift({to:l.n,subj:"Agenda for our one to one",body,at:nowStr()});save();closeDrawer();toast("Agenda sent to "+l.n);return render(true);}
  if(a==="handle"){S.handled[id]="Dismissed at "+nowStr();delete S.snoozed[id];save();toast("Signal cleared");render(true);refreshDrawer();return;}
  if(a==="snooze"){S.snoozed[id]=1;save();toast("Snoozed until tomorrow morning");render(true);refreshDrawer();return;}
  if(a==="unsnooze"){delete S.snoozed[id];save();toast("Signal is back");return render(true);}
  if(a==="reopen"){delete S.handled[id];delete S.snoozed[id];save();toast("Signal reopened");render(true);refreshDrawer();return;}
  if(a==="up"||a==="down"){const r=ROSTER[+id],lv=Math.max(0,Math.min(r.cap?1:3,lvlOf(r)+(a==="up"?1:-1)));S.levels[r.n]=lv;save();toast(short(r.n)+" set to "+LVL[lv]);return render(true);}
  if(a==="setlvl"){const r=rosterOf(id),lv=+v;S.levels[id]=lv;save();toast(short(id)+" set to "+LVL[lv]);render(true);refreshDrawer();return;}
  if(a==="pause"){S.paused[id]=!S.paused[id];save();toast(short(id)+(S.paused[id]?" paused":" resumed"));render(true);refreshDrawer();return;}
  if(a==="pull"){S.pulled[id]=1;S.sent.unshift({to:"Chief Digital Officer",subj:"Pull forward: "+short(id),body:`Karen would like to understand what it would take to bring the ${short(id)} agent forward from wave three.\n\nCould you and the team come back with the dependency and the cost in time?`,at:nowStr()});save();toast("Asked the CDO what it would take");return refreshDrawer();}
  if(a==="mrange"){mRange=+v;return refreshDrawer();}
  if(a==="mtab"){mTab=+v;mSeg=null;return refreshDrawer();}
  if(a==="mseg"){mSeg=(mSeg===+v)?null:+v;return refreshDrawer();}
  if(a==="ffilter"){feedFilter=v;return refreshDrawer();}
  if(a==="ans"){return renderAnswer(+i);}
  if(a==="askgo"){return askGo();}
}
function go(spec){
  const k=spec.indexOf(":"),t=spec.slice(0,k),id=spec.slice(k+1);
  if(t==="agent")openAgent(id);else if(t==="metric")openMetric(id);else if(t==="decision")openDecision(id);else if(t==="signal")openSignal(id);
  else if(t==="feed")openFeed(id);else if(t==="stream")openStream(id);else if(t==="leader")openLeader(id);else if(t==="skill")openSkill(id);
  else if(t==="source")openSource(id);else if(t==="sent")openSent(id);else if(t==="info")openInfo(id);else if(t==="activity")openActivity();
  else if(t==="view")gotoView(id);else if(t==="prio"){view="priorities";selPrio=id;closeDrawer();render();}
  else if(t==="ask"){gotoView("ask");renderAnswer(+id);}
}
function askGo(){
  const ai=$("askin");if(!ai)return;const q=ai.value.trim().toLowerCase();if(!q)return;
  let best=-1,score=0;ANSWERS.forEach((a,i)=>{const words=a.q.toLowerCase().replace(/[^a-z ]/g,"").split(" ").filter(w=>w.length>3);const m=words.filter(w=>q.includes(w)).length;if(m>score){score=m;best=i;}});
  if(best>=0){renderAnswer(best);}
  else{$("ansbox").innerHTML=`<div class="card pad answer"><div class="q">You asked</div><div style="font-weight:600;font-size:15px;margin-bottom:12px">${esc(ai.value)}</div><div class="a"><p>In production Matrix would answer this from the semantic layer and name the agents behind it. This prototype carries six pre composed answers.</p></div><div class="sugg" style="margin-top:0">${ANSWERS.map((a,i)=>`<button data-act="ans" data-i="${i}">${a.q}</button>`).join("")}</div></div>`;}
}

/* ================= palette ================= */
let palRes=[],palSel=0;
function buildIndex(){
  const ix=[];
  ROSTER.forEach(r=>ix.push({t:r.n,k:"Agent",go:"agent:"+r.n}));
  Object.keys(PLANNED).forEach(n=>ix.push({t:n,k:"Planned agent",go:"agent:"+n}));
  LEADERS.forEach(l=>ix.push({t:l.n+" "+l.role,k:"Leader",go:"leader:"+l.id}));
  PRIOS.forEach(p=>ix.push({t:p.t,k:"Priority",go:"prio:"+p.id}));
  SIGNALS.forEach(s=>ix.push({t:s.t,k:"Signal",go:"signal:"+s.id}));
  DECISIONS.forEach(d=>ix.push({t:d.t,k:"Decision",go:"decision:"+d.id}));
  METRICS.forEach(m=>ix.push({t:m.k,k:"Metric",go:"metric:"+m.id}));
  STREAMS.forEach(s=>ix.push({t:s.id+" "+s.n,k:"Stream",go:"stream:"+s.id}));
  ANSWERS.forEach((a,i)=>ix.push({t:a.q,k:"Question",go:"ask:"+i}));
  return ix;
}
function palRender(q){
  const w=q.toLowerCase().split(/\s+/).filter(Boolean);
  palRes=buildIndex().filter(e=>w.every(x=>(e.t+" "+e.k).toLowerCase().includes(x))).slice(0,9);palSel=0;
  $("palres").innerHTML=palRes.map((e,i)=>`<div class="${i===palSel?"on":""}" data-pal="${i}"><span>${esc(e.t)}</span><small>${e.k}</small></div>`).join("")||`<div style="cursor:default;color:var(--faint)">No matches</div>`;
}
function openPal(){$("pal").classList.add("on");$("palin").value="";palRender("");$("palin").focus();}
function closePal(){$("pal").classList.remove("on");}
function palPick(i){const e=palRes[i];if(!e)return;closePal();closeDrawer();go(e.go);}

/* ================= render ================= */
function render(keep){
  renderNav();
  const titles={today:"Today",priorities:"Priorities",leaders:"My leaders",signals:"Signals",agents:"Agents",streams:"Streams",ask:"Ask Matrix"};
  $("pagetitle").textContent=titles[view];$("crumb").textContent="Bloomberg Media  ·  Karen Saltser, Chief Executive Officer";
  $("content").innerHTML={today:vToday,priorities:vPriorities,leaders:vLeaders,signals:vSignals,agents:vAgents,streams:vStreams,ask:vAsk}[view]();
  if(view==="ask"){const ai=$("askin");if(ai)ai.onkeydown=e=>{if(e.key==="Enter")askGo();};}
  if(!keep&&window.scrollTo)window.scrollTo({top:0});
}

/* ================= events ================= */
document.addEventListener("click",e=>{
  if(e.target.closest("[data-close]")){closeDrawer();return;}
  if(e.target.closest("[data-back]")){back();return;}
  const p=e.target.closest("[data-pal]");if(p){palPick(+p.dataset.pal);return;}
  if(e.target===$("pal")){closePal();return;}
  const a=e.target.closest("[data-act]");if(a){act(a);return;}
  const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);return;}
  const pt=e.target.closest(".pt");if(pt&&curMetric)chartRead(+pt.dataset.i);
});
document.addEventListener("mouseover",e=>{const pt=e.target.closest&&e.target.closest(".pt");if(pt&&curMetric)chartRead(+pt.dataset.i);});
function chartRead(i){
  const m=curMetric,vals=m.s.slice(-mRange),el=$("chartread");if(!el||vals[i]===undefined)return;
  const d=i>0?vals[i]-vals[i-1]:null;
  el.innerHTML=`<b>Wk ${m.s.length-vals.length+i+1}</b>: ${vals[i].toFixed(m.dec)}${m.u}${d===null?"":` &nbsp;(${d>0?"+":""}${d.toFixed(m.dec)} on the week before)`}`;
}
document.addEventListener("keydown",e=>{
  const pal=$("pal").classList.contains("on");
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openPal();return;}
  if(e.key==="Escape"){if(pal)closePal();else closeDrawer();return;}
  if(pal){if(e.key==="ArrowDown"){palSel=Math.min(palRes.length-1,palSel+1);}else if(e.key==="ArrowUp"){palSel=Math.max(0,palSel-1);}else if(e.key==="Enter"){palPick(palSel);return;}else return;
    $("palres").querySelectorAll("[data-pal]").forEach((d,i)=>d.classList.toggle("on",i===palSel));e.preventDefault();return;}
  if(e.key==="/"&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();openPal();return;}
  if((e.key==="Enter"||e.key===" ")&&document.activeElement&&document.activeElement.getAttribute("role")==="button"){e.preventDefault();document.activeElement.click();}
});
$("palin").oninput=e=>palRender(e.target.value);
$("palbtn").onclick=openPal;
$("backdrop").onclick=closeDrawer;
$("themebtn").onclick=()=>{const cur=document.documentElement.getAttribute("data-theme");const dark=cur==="dark"||(!cur&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-theme",dark?"light":"dark");};
$("resetbtn").onclick=()=>{S={decided:{},sent:[],levels:{},handled:{},snoozed:{},paused:{},pulled:{}};save();closeDrawer();toast("Session reset");render();};
$("datechip").textContent=new Date().toLocaleDateString([], {weekday:"long",day:"numeric",month:"long"});
render();

</script>
</body>
</html>
